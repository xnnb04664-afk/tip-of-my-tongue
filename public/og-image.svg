<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="180" fill="#FBBF24" opacity="0.25" />
  <circle cx="100" cy="530" r="140" fill="#F59E0B" opacity="0.15" />

  <!-- Center Card -->
  <rect x="120" y="100" width="960" height="430" rx="32" fill="#FFFFFF" stroke="#FDE68A" stroke-width="4" filter="drop-shadow(0 20px 30px rgba(217, 119, 6, 0.12))" />

  <!-- App Icon Badge -->
  <rect x="180" y="150" width="72" height="72" rx="20" fill="url(#badge)" />
  <circle cx="216" cy="186" r="16" fill="none" stroke="#FFFFFF" stroke-width="4" />
  <path d="M211 180 a5 5 0 0 1 10 2 c0 4 -5 5 -5 5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <circle cx="216" cy="198" r="2.5" fill="#FFFFFF" />

  <!-- Tagline Badge -->
  <rect x="270" y="166" width="310" height="40" rx="20" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5" />
  <text x="286" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#92400E">🧠 概念反向检索词典 · Tip of My Tongue</text>

  <!-- Main Title -->
  <text x="180" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="54" font-weight="900" fill="#1C1917" letter-spacing="-1">话到嘴边？帮你找回想不起的名字</text>

  <!-- Subtitle -->
  <text x="180" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="500" fill="#78716C">专治人类词穷与遗忘焦虑，输入口语化细节、外形或感觉，智能反向锁定标准正名。</text>

  <!-- Tags Preview -->
  <g transform="translate(180, 410)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="44" rx="14" fill="#F5F5F4" stroke="#E7E5E4" />
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#44403C">鞋带两端的塑料头 ➔ 鞋带箍</text>

    <!-- Tag 2 -->
    <rect x="200" y="0" width="230" height="44" rx="14" fill="#F5F5F4" stroke="#E7E5E4" />
    <text x="218" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#44403C">揉眼冒金星 ➔ 光幻视</text>

    <!-- Tag 3 -->
    <rect x="450" y="0" width="220" height="44" rx="14" fill="#F5F5F4" stroke="#E7E5E4" />
    <text x="468" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#44403C">初雨泥土味 ➔ 潮土油</text>
  </g>
</svg>
